name: Deploy to GitHub Pages

# Builds the static web bundle (the same `expo export` the Docker image uses)
# and publishes it to GitHub Pages. The app is entirely client-side, so the
# exported files are the whole site.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Engine + root deps, then the app (apps/mobile is not an npm workspace).
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/mobile install

      - name: Export the static web bundle
        run: npm --prefix apps/mobile run export:web

      # Jekyll (Pages' default) would drop the _expo/ folder; .nojekyll disables
      # it. 404.html mirrors index.html so deep links / reloads still resolve.
      - name: Prepare files for Pages
        run: |
          touch apps/mobile/dist/.nojekyll
          cp apps/mobile/dist/index.html apps/mobile/dist/404.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
