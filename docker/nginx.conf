server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # A single-page app: anything that is not a real file falls back to the
    # one index.html, so the app always loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle and the images carry a content hash in their name, so they can
    # be cached forever — a new build gets new names.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
